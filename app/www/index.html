<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>TV Remote</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(255,255,255,0.05);
    --panel-hi: rgba(255,255,255,0.09);
    --line: rgba(255,255,255,0.08);
    --text: #eef1f7;
    --muted: #8a93a6;
    --accent: #7c8cff;
    --accent-2: #c86bff;
    --good: #3ddc97;
    --bad: #ff5d73;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(700px 500px at 0% -10%, rgba(124,140,255,0.2), transparent 60%),
      radial-gradient(600px 500px at 110% 10%, rgba(200,107,255,0.15), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .wrap { padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .logo { width: 40px; height: 40px; border-radius: 12px; flex: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(124,140,255,0.35); }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { color: var(--muted); display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 4px rgba(255,93,115,0.15); }
  .dot.on { background: var(--good); box-shadow: 0 0 0 4px rgba(61,220,151,0.15); }
  .icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); flex: none; }
  .icon-btn.power { color: #ffb3bf; border-color: rgba(255,93,115,.3); background: rgba(255,93,115,.1); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }

  .page { display: none; }
  .page.show { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  /* D-pad */
  .dpad { position: relative; width: min(78vw, 280px); aspect-ratio: 1; margin: 8px auto 22px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 20px 40px rgba(0,0,0,0.35); }
  .dir { position: absolute; width: 30%; height: 30%; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
  .dir:active { color: var(--text); background: rgba(255,255,255,0.07); }
  .dir.up { top: 2%; left: 35%; } .dir.down { bottom: 2%; left: 35%; }
  .dir.left { left: 2%; top: 35%; } .dir.right { right: 2%; top: 35%; }
  .ok { position: absolute; inset: 29%; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-2)); font-weight: 700; font-size: 17px; letter-spacing: .05em; box-shadow: 0 10px 30px rgba(124,140,255,0.4); transition: transform .08s; }
  .ok:active { transform: scale(.94); }

  .row { display: flex; gap: 10px; justify-content: center; }
  .round { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); transition: transform .08s; }
  .round:active { transform: scale(.92); background: var(--panel-hi); }

  .rockers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .rocker { display: flex; flex-direction: column; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .rocker button { width: 100%; padding: 16px 0; display: grid; place-items: center; }
  .rocker button:active { background: var(--panel-hi); }
  .rocker span { font-size: 11px; letter-spacing: .14em; color: var(--muted); }

  .vol { display: flex; align-items: center; gap: 14px; }
  .vol output { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), rgba(255,255,255,0.1) var(--p, 0%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .mute.on { color: var(--bad); }

  .search { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 12px 14px; font: inherit; outline: none; margin-bottom: 14px; user-select: text; }
  .search:focus, .field:focus { border-color: var(--accent); }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .app { position: relative; aspect-ratio: 16/11; border-radius: 16px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); background: var(--tile, #1a1d26); transition: transform .1s; }
  .app:active { transform: scale(.95); }
  .app.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app img { max-width: 60%; max-height: 60%; object-fit: contain; }
  .app .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px 6px; font-size: 11px; font-weight: 500; text-align: center; display: none; }
  .app.noimg .name { display: block; position: static; padding: 6px; }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { padding: 11px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 500; }
  .chip.off { color: var(--muted); }
  .chip.active { background: linear-gradient(135deg, rgba(124,140,255,.25), rgba(200,107,255,.25)); border-color: rgba(124,140,255,.5); }

  .msg { display: flex; gap: 10px; }
  .field { flex: 1; min-width: 0; background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 12px 14px; font: inherit; outline: none; user-select: text; }
  .primary { padding: 0 18px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 600; min-height: 46px; }
  .ghost { padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 500; }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  nav {
    position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    max-width: 536px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(22,24,33,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line); border-radius: 22px; padding: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 16px; font-size: 11px; color: var(--muted); }
  nav button.on { color: var(--text); background: rgba(124,140,255,.16); }

  .banner { display: none; background: linear-gradient(135deg, rgba(124,140,255,.2), rgba(200,107,255,.2)); border: 1px solid rgba(124,140,255,.4); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .banner.show { display: block; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 20px); opacity: 0; background: rgba(20,22,30,.96); border: 1px solid var(--line); padding: 11px 16px; border-radius: 14px; transition: all .25s; pointer-events: none; font-size: 14px; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(255,93,115,.5); color: #ffd0d6; }
  svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg></div>
      <div style="min-width:0">
        <h1 id="model">LG TV</h1>
        <small><span class="dot" id="dot"></span><span id="state">Connecting…</span></small>
      </div>
    </div>
    <button class="icon-btn" data-act="screenOff" title="Screen off"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button class="icon-btn power" id="power" title="Power"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></button>
  </header>

  <div class="banner" id="pairBanner">📺 Look at your TV and press <b>Accept</b> with the remote (or the TV's own button).</div>

  <!-- Remote -->
  <section class="page show" data-page="remote">
    <div class="card">
      <div class="dpad">
        <div class="ring"></div>
        <button class="dir up" data-btn="UP"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="dir down" data-btn="DOWN"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="dir left" data-btn="LEFT"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="dir right" data-btn="RIGHT"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="ok" data-btn="ENTER">OK</button>
      </div>
      <div class="row">
        <button class="round" data-btn="BACK"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="round" data-btn="HOME"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
        <button class="round" data-btn="MENU"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
        <button class="round mute" id="mute"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg></button>
      </div>
      <div class="rockers">
        <div class="rocker">
          <button data-act="volumeUp"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <span>VOL</span>
          <button data-act="volumeDown"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        </div>
        <div class="rocker">
          <button data-act="channelUp"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
          <span>CH</span>
          <button data-act="channelDown"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="vol">
        <svg viewBox="0 0 24 24" style="color:var(--muted)"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input type="range" id="volume" min="0" max="100" value="0">
        <output id="volOut">–</output>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <button class="round" data-act="rewind"><svg viewBox="0 0 24 24"><path d="m11 19-9-7 9-7zM22 19l-9-7 9-7z"/></svg></button>
        <button class="round" data-act="play"><svg viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg></button>
        <button class="round" data-act="pause"><svg viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg></button>
        <button class="round" data-act="fastForward"><svg viewBox="0 0 24 24"><path d="m13 19 9-7-9-7zM2 19l9-7-9-7z"/></svg></button>
      </div>
    </div>
  </section>

  <!-- Apps -->
  <section class="page" data-page="apps">
    <input class="search" id="search" placeholder="Search apps…">
    <div class="apps" id="apps"></div>
  </section>

  <!-- Inputs + message -->
  <section class="page" data-page="inputs">
    <div class="card">
      <h2>Inputs</h2>
      <div class="chips" id="inputs"></div>
    </div>
    <div class="card">
      <h2>Message on TV</h2>
      <form class="msg" id="msgForm">
        <input class="field" id="msg" placeholder="Pop up a message…" maxlength="200">
        <button class="primary">Send</button>
      </form>
    </div>
  </section>

  <!-- Settings -->
  <section class="page" data-page="settings">
    <div class="card">
      <h2>TV address</h2>
      <form class="msg" id="ipForm">
        <input class="field" id="ip" placeholder="192.168.1.50" inputmode="decimal">
        <button class="primary">Connect</button>
      </form>
      <button class="ghost" id="scan" style="margin-top:12px;width:100%">Find TV on Wi-Fi</button>
      <div class="list" id="found"></div>
      <p class="note">Phone and TV must be on the same Wi-Fi. For “Power on” to work, turn on <b>Settings → General → Devices → TV Management → Turn on via Wi-Fi</b> on the TV.</p>
    </div>
  </section>
</div>

<nav>
  <button class="on" data-tab="remote"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Remote</button>
  <button data-tab="apps"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</button>
  <button data-tab="inputs"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>Inputs</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Setup</button>
</nav>
<div class="toast" id="toast"></div>

<script src="capacitor.js"></script>
<script src="tv.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let current = {};
let apps = [];
const iconCache = {};

const buzz = () => { try { navigator.vibrate(12); } catch {} };

let toastTimer;
function toast(text, err) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast"), 2200);
}

async function act(action, body, done) {
  buzz();
  try { await TV.run(action, body); if (done) toast(done); setTimeout(refresh, 300); }
  catch (e) { toast(e.message, true); }
}

function showTab(name) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".page").forEach((p) => p.classList.toggle("show", p.dataset.page === name));
}
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

function setVolume(v) {
  if (v == null) return;
  $("volume").value = v;
  $("volume").style.setProperty("--p", v + "%");
  $("volOut").textContent = v;
}

let wasConnected = false;
async function refresh() {
  const s = await TV.status().catch(() => ({ connected: false }));
  current = s;
  $("dot").classList.toggle("on", s.connected);
  $("state").textContent = s.connected ? "Connected"
    : TV.pairing ? "Waiting for approval on TV"
    : TV.ip ? "Offline · tap power to wake" : "Set up your TV";
  if (s.connected) $("pairBanner").classList.remove("show");
  if (s.model) $("model").textContent = `LG ${s.model}`;
  if (!volDragging) setVolume(s.volume);
  $("mute").classList.toggle("on", !!s.muted);
  document.querySelectorAll(".app").forEach((el) => el.classList.toggle("active", el.dataset.id === s.appId));
  document.querySelectorAll(".chip").forEach((el) => el.classList.toggle("active", el.dataset.app === s.appId));
  if (s.connected && !wasConnected) loadLists();
  wasConnected = s.connected;
}

async function loadLists() {
  try { apps = await TV.apps(); renderApps(); } catch (e) { toast("Could not load apps", true); }
  try {
    const inputs = await TV.inputs();
    $("inputs").innerHTML = "";
    inputs.forEach((i) => {
      const b = document.createElement("button");
      b.className = "chip" + (i.connected ? "" : " off");
      b.textContent = i.label;
      b.dataset.app = i.appId || "";
      b.onclick = () => act("switchInput", { inputId: i.id }, `Switched to ${i.label}`);
      $("inputs").appendChild(b);
    });
  } catch {}
}

function renderApps() {
  const q = $("search").value.trim().toLowerCase();
  $("apps").innerHTML = "";
  apps.filter((a) => a.title.toLowerCase().includes(q)).forEach((a) => {
    const b = document.createElement("button");
    b.className = "app" + (a.id === current.appId ? " active" : "");
    b.dataset.id = a.id;
    if (a.bgColor) b.style.setProperty("--tile", a.bgColor);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = a.title;
    b.appendChild(name);
    if (a.icon) {
      const img = document.createElement("img");
      img.alt = a.title;
      const show = (src) => { img.src = src; b.prepend(img); };
      if (iconCache[a.icon]) show(iconCache[a.icon]);
      else TV.icon(a.icon).then((src) => { iconCache[a.icon] = src; show(src); }).catch(() => b.classList.add("noimg"));
    } else b.classList.add("noimg");
    b.onclick = () => act("launch", { id: a.id }, `Opening ${a.title}`);
    $("apps").appendChild(b);
  });
}

document.querySelectorAll("[data-btn]").forEach((b) => (b.onclick = () => act("button", { name: b.dataset.btn })));
document.querySelectorAll("[data-act]").forEach((b) => {
  b.onclick = () => act(b.dataset.act, {}, b.dataset.act === "screenOff" ? "Screen off — press any button to wake" : null);
});
$("power").onclick = () => {
  if (current.connected) { if (confirm("Turn the TV off?")) act("powerOff", {}, "Turning off…"); }
  else act("powerOn", {}, "Waking TV…");
};

let volDragging = false, volTimer;
$("volume").addEventListener("input", (e) => {
  volDragging = true;
  setVolume(e.target.value);
  clearTimeout(volTimer);
  volTimer = setTimeout(() => { TV.run("setVolume", { volume: +e.target.value }).catch((err) => toast(err.message, true)); volDragging = false; }, 120);
});
$("mute").onclick = () => act("mute", { mute: !current.muted });
$("search").addEventListener("input", renderApps);
$("msgForm").onsubmit = (e) => {
  e.preventDefault();
  const m = $("msg").value.trim();
  if (!m) return;
  act("toast", { message: m }, "Sent to TV");
  $("msg").value = "";
};

function connectTo(ip) {
  $("ip").value = ip;
  TV.start(ip);
  toast(`Connecting to ${ip}…`);
  showTab("remote");
}
$("ip").value = TV.ip;
$("ipForm").onsubmit = (e) => { e.preventDefault(); const ip = $("ip").value.trim(); if (ip) connectTo(ip); };
$("scan").onclick = async () => {
  $("scan").textContent = "Searching…";
  $("found").innerHTML = "";
  try {
    const hosts = await TV.scan();
    if (!hosts.length) $("found").innerHTML = '<p class="note">No TV found. Is it on?</p>';
    hosts.forEach((h) => {
      const b = document.createElement("button");
      b.className = "ghost";
      b.textContent = `📺 ${h}`;
      b.onclick = () => connectTo(h);
      $("found").appendChild(b);
    });
  } catch (e) { toast(e.message, true); }
  $("scan").textContent = "Find TV on Wi-Fi";
};

TV.onChange = refresh;
TV.onPrompt = () => { $("pairBanner").classList.add("show"); refresh(); };
TV.onPairFail = () => {
  $("pairBanner").classList.remove("show");
  toast("TV didn't approve. Tap Connect in Setup to try again.", true);
  refresh();
};
if (!TV.ip) showTab("settings");
TV.start();
refresh();
setInterval(refresh, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (!TV.ready) TV.start(); refresh(); } });
</script>
</body>
</html>
